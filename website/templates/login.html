{% extends "base.html" %} 
{% block title %}Connextion{% endblock %} 
{% block content %}
<section class="bg-success py-3 py-md-5 py-xl-8">
    <div class="container">
      <div class="row gy-4 align-items-center">
        <div class="col-12 col-md-6 col-xl-7">
          <div class="d-flex justify-content-center text-bg-primary">
            <div class="col-12 col-xl-9">
              <div class="col">
                <img src="../assets/img/Secure login-bro (2).svg" alt="Login">
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-5">
          <div class="card border-0 rounded-4">
            <div class="card-body p-3 p-md-4 p-xl-5">
              <div class="row">
                <div class="col-12">
                  <div class="mb-4">
                    <h3 class="text-center">Connexion</h3>
                  </div>
                </div>
              </div>
              <form method="POST">
                <div class="row gy-3 overflow-hidden">
                  <div class="col-12">
                    <div class="form-floating mb-3">
                      <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required>
                      <label for="email" class="form-label">Email</label>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-floating mb-3">
                      <input type="password" class="form-control" name="password" id="password" value="" placeholder="Password" required>
                      <label for="password" class="form-label">Mot de passe</label>
                    </div>
                    <p>Vous n'avez pas de compte ?<a href="/sign-up" class="text-decoration-none text-success"><strong> S'inscrire ici</strong></a></p>
                  </div>
                  <div class="col-12">
                    <div class="d-grid">
                      <button class="btn btn-success btn-lg" type="submit">Se connecter</button>
                    </div>
                  </div>
                </div>
              </form>
              <div class="row">
            </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
 {% endblock %}
