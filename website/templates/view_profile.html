{% extends "base.html" %} 
{% block title %}Profil{% endblock %} 
{% block content %}

<section class="bg-success py-3 py-md-5 py-xl-8">
    <div class="container">
      <div class="row gy-4 align-items-center">
        <div class="col-12 col-md-6 col-xl-7">
          <div class="d-flex justify-content-center text-bg-primary">
            <div class="col-12 col-xl-9">
              <div class="col">
                <img src="assets/img/Setup-bro.svg" alt="Login">
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-5">
          <div class="card border-0 rounded-4">
            <div class="card-body p-3 p-md-4 p-xl-5">
              <div class="row">
                <div class="col-12">
                  <div class="mb-4">
                    <h3 class="text-center">Profile</h3>
                  </div>
                </div>
              </div>
              <form action="/profile" method="POST">
                <!-- Champ caché pour spécifier la méthode de requête pour la suppression -->
                <input type="hidden" name="_method_delete" value="DELETE">
                <!-- Champ caché pour spécifier la méthode de requête pour la mise à jour -->
                <input type="hidden" name="_method_update" value="PUT">
                
                <div class="row gy-3 overflow-hidden">
                    <div class="col-12">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" name="name" id="name" placeholder="Nom Complet">
                            <label for="name" class="form-label">{{user.full_name}}</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com">
                            <label for="email" class="form-label">{{user.email}}</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" name="tel" id="tel" placeholder="Numéro de téléphone">
                            <label for="tel" class="form-label">{{user.tel}}</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-between">
                    <!-- Bouton de suppression -->
                    <button type="submit" name="_method" value="DELETE" class="btn btn-danger btn-lg" style="margin-left: 20px;" onclick="return confirm('Are you sure you want to delete your profile?');">Supprimer le Profil</button>
                    <!-- Bouton de mise à jour -->
                    <button type="submit" name="_method" value="PUT" class="btn btn-primary btn-lg" style="margin-right: 20px;">Modifier le Profil</button>
                </div>
            </form>
                
            </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  {% endblock %}
